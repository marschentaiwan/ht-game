function drawQR(el,text){if(!el||typeof qrcode==='undefined')return;const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),cs=8,m=4,size=(n+m*2)*cs;
 const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);x.fillStyle='#042B1F';
 for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+m)*cs,(r+m)*cs,cs,cs);el.innerHTML='';el.appendChild(c);}

function home(){
 H(`<div class="split"><div class="left"><img class="logo" src="${LOGO}">
 <h1 class="hero">From Ideas<span class="l2">to Habits</span></h1>
 <p class="sub">從願意、技能到做得到——經銷商夥伴與總公司一路走來，一起把 Human Touch 變成每天的服務。今天，全據點一起掃碼上線，合作破關，邁向 <b style="color:var(--g)">Human Touch Next Level</b>。</p>
 ${roadHtml(-1)}</div>
 <div class="right"><div class="eyebrow">NEXT LEVEL · 據點協作挑戰</div><h2 class="ftitle">選擇你的入口</h2><p class="hint">主持人（DQM／主管）開啟挑戰房間並投影；夥伴用手機掃 QR Code 加入，一起作答破關。</p>
 <div class="menu">
 <div class="card" onclick="location.href='?host=1'"><div class="eyebrow">01 · HOST</div><h3>開啟挑戰房間</h3><p>選擇據點、產生 QR Code，投影在會議室大螢幕帶領全隊破關。</p></div>
 <div class="card" onclick="joinCode()"><div class="eyebrow">02 · JOIN</div><h3>輸入房間代碼加入</h3><p>沒辦法掃碼時，輸入大螢幕上的 4 碼代碼。</p></div>
 <div class="card" onclick="location.href='?board=1'"><div class="eyebrow">03 · BOARD</div><h3>各據點成績看板</h3><p>參與據點、參加人員、答對率與顧客溫度，可匯出 CSV。</p></div>
 </div></div></div>`);}
window.joinCode=()=>{const c=(prompt('請輸入房間代碼')||'').trim().toUpperCase();if(c)location.href='?room='+c;};

let R=null,RID=null,PLAYERS=[],ANS=[],timerI=null;
function hostSetup(){
 H(`<div class="split"><div class="left"><img class="logo" src="${LOGO}"><h1 class="hero">開啟<span class="l2">挑戰房間</span></h1><p class="sub">建議在晨會或訓練時進行，約 25–30 分鐘。銷售與售服夥伴混合組隊效果最好。</p>${roadHtml(-1)}</div>
 <div class="right"><div class="eyebrow">HOST SETUP</div><h2 class="ftitle">挑戰設定</h2><p class="hint">一個房間代表一個據點的一場挑戰，成績會記錄到該據點。</p>
 <div class="field"><label>經銷商據點</label><select id="ol"><option value="">— 請選擇 —</option>${outletOptions()}</select></div>
 <div class="field"><label>主持人</label><input id="hn" placeholder="例：DQM 王小明"></div>
 <div class="field"><label>每題討論時間</label><select id="tm"><option value="45">45 秒</option><option value="60" selected>60 秒</option><option value="90">90 秒</option></select></div>
 <button class="btn" id="mk"><span>建立房間 CREATE</span></button><button class="btn ghost" onclick="location.href='?'"><span>返回</span></button></div></div>`);
 document.getElementById('mk').onclick=async()=>{const ol=document.getElementById('ol').value;if(!ol)return alert('請選擇據點');
  const code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
  const room={code,outlet:ol,region:regionOf(ol),host:document.getElementById('hn').value.trim(),sec:+document.getElementById('tm').value,
   phase:'lobby',si:0,qi:0,temp:0,tools:{},toolUsed:{},hint:null,event:null,deadline:0,log:[],createdAt:new Date().toISOString()};
  try{await setDoc(doc(db,ROOMS,code),room);}catch(e){return alert('雲端建立失敗：'+e.message+'\n請確認 Firestore 規則已開放 htg_rooms。');}
  history.replaceState(null,'','?host='+code);hostRun(code);};
}
function hostRun(code){RID=code;
 onSnapshot(doc(db,ROOMS,code),s=>{if(!s.exists())return H('<div class="board">找不到房間</div>');R=s.data();hostRender();});
 onSnapshot(collection(db,ROOMS,code,'players'),s=>{PLAYERS=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.joinedAt||'').localeCompare(b.joinedAt||''));hostRender();});
 onSnapshot(collection(db,ROOMS,code,'answers'),s=>{ANS=s.docs.map(d=>d.data());hostRender();maybeAuto();});}
const upd=o=>updateDoc(doc(db,ROOMS,RID),o);
function toolIcon(pid){return Object.entries(R.tools||{}).filter(([t,p])=>p===pid).map(()=>' 🎫').join('');}
function side(){const url=BASE+'?room='+RID;const k=R.si+'_'+R.qi;const answered=new Set(ANS.filter(a=>a.k===k).map(a=>a.pid));
 const pct=Math.min(100,Math.round(R.temp/((FLAT.length*10+60)*Math.max(PLAYERS.length,1))*100*1.2));
 return `<div class="hside"><img class="logo" style="width:180px" src="${LOGO}">
 <div><div class="lbl">據點 OUTLET</div><div class="serif" style="font-size:22px;font-weight:700;margin-top:4px">${esc(R.outlet)}</div></div>
 <div class="qrbox" id="qr"></div><div class="code">${RID}</div><div class="lbl" style="text-align:center">掃碼或輸入代碼加入 · 隨時可加入</div>
 <div><div class="lbl">團隊顧客溫度 CUSTOMER WARMTH</div><div class="big">${R.temp}°</div><div class="meter"><i style="width:${pct}%"></i></div></div>
 <div><div class="lbl">夥伴 ${PLAYERS.length} 位${R.phase==='question'?` · 已作答 ${answered.size}`:''}</div><div class="plist" style="margin-top:8px">${PLAYERS.map(p=>`<span class="${answered.has(p.id)||(R.phase==='final'&&p.habit)?'a':''}">${esc(p.name)}${toolIcon(p.id)}</span>`).join('')||'<span>等待夥伴加入…</span>'}</div></div>
 <div style="margin-top:auto;font-size:11px;color:rgba(255,255,255,.4);word-break:break-all">${url}</div></div>`;}
function hostRender(){if(!R)return;const st=STAGES[R.si];let main='';
 const prog=`<div class="prog">${STAGES.map((s,i)=>`<div class="${i<R.si?'done':i===R.si&&R.phase!=='lobby'?'on':''}"></div>`).join('')}</div>`;
 const head=`<div class="hhead"><div class="eyebrow">HUMAN TOUCH · NEXT LEVEL CHALLENGE</div><div style="font-size:13px;color:rgba(10,31,24,.6)">主持人 <b>${esc(R.host||'—')}</b></div></div>`;
 if(R.phase==='lobby'){main=`<div class="stagebig">READY</div><h2 class="qtext">歡迎 ${esc(R.outlet)} 的夥伴！<br>請用手機掃描右側 QR Code 加入挑戰。</h2>
  <div class="card"><h3>今天的遊戲規則</h3><p>① 全隊共用一個「顧客溫度」，每位夥伴答對都會為團隊加溫。<br>② 每題請先和身邊夥伴討論，再各自在手機上作答。<br>③ 第 3 關會隨機發給 3 位夥伴「HT 工具包」，持有人可在關鍵時刻為全隊使用一次。<br>④ 最後每人寫下一個要留下來的習慣，一起拼出我們的 Human Touch。</p></div>
  <button class="btn" style="max-width:420px;margin-top:24px" ${PLAYERS.length?'':'disabled'} onclick="hStage(0)"><span>開始挑戰 START · ${PLAYERS.length} 位夥伴</span></button>`;}
 else if(R.phase==='intro'){main=`<div class="eyebrow">STAGE ${st.no} · ${st.period}</div><div class="stagebig">${st.key}</div><h2 class="qtext">第 ${+st.no} 關｜${st.title}</h2><p style="font-size:19px;line-height:1.9;max-width:820px">${st.story}</p>
  ${st.able?`<div class="toolrow">${Object.entries(TOOLS).map(([t,v])=>`<div class="tchip">🎫 ${v.name}｜持有人：<b>${esc((PLAYERS.find(p=>p.id===R.tools[t])||{}).name||'—')}</b><br><small>${v.fx}</small></div>`).join('')}</div>`:''}
  <button class="btn" style="max-width:420px;margin-top:28px" onclick="${st.final?'hFinal()':'hQ('+R.si+',0)'}"><span>${st.final?'開始拼圖 BUILD TOGETHER':'進入第 1 題 GO'}</span></button>`;}
 else if(R.phase==='question'||R.phase==='reveal'){const q=st.q[R.qi],k=qkey(R.si,R.qi),as=ANS.filter(a=>a.k===k),rv=R.phase==='reveal';
  const cnt=[0,1,2].map(i=>as.filter(a=>a.c===i).length);
  main=`<div class="eyebrow">STAGE ${st.no} · ${st.key} · 第 ${R.qi+1} / ${st.q.length} 題</div>
  ${R.event?`<div class="event" style="margin-top:12px">⚡ <b>現場狀況：${R.event.t}</b>　${R.event.d}</div>`:''}
  ${st.able&&q.st!==undefined?`<div class="cycle" style="margin-top:10px">${ABLE_STEPS.map((s,i)=>`<span class="${i===q.st?'on':''}">${s}</span>`).join('')}</div>`:''}
  ${q.tool?`<div class="vtag" style="margin-top:10px;background:var(--accent)">工具包｜${TOOLS[q.tool].name}</div>`:''}
  <div class="qtext">${q.s}</div>
  <div class="opts">${q.o.map((o,i)=>`<div class="opt ${rv?(i===q.a?'ok':'no'):''} ${R.hint&&R.hint.k===k&&R.hint.cut===i?'cut':''}">${rv?`<div class="bar" style="width:${as.length?cnt[i]/as.length*100:0}%"></div>`:''}<span class="k">${K[i]}</span><span>${o}</span>${rv?`<span class="cnt">${cnt[i]}</span>`:''}</div>`).join('')}</div>
  ${st.able?`<div class="toolrow">${Object.entries(TOOLS).map(([t,v])=>`<div class="tchip ${R.toolUsed[t]===k?'used':R.toolUsed[t]?'gone':''}">🎫 ${v.name}${R.toolUsed[t]===k?' · 本題啟用！':R.toolUsed[t]?' · 已使用':''}</div>`).join('')}</div>`:''}
  ${rv?`<div class="reveal">${q.v?`<span class="vtag">${q.v}</span>`:''}${q.c?`<span class="credit">真實案例 · ${q.c}</span>`:''}<p>${q.e}</p><p style="color:var(--g);font-family:'Bebas Neue';letter-spacing:.15em;font-size:20px;margin-top:10px">答對 ${R.lastGain?.c??0} / ${as.length} 位 · 顧客溫度 +${R.lastGain?.g??0}°</p></div>
   <button class="btn" style="max-width:420px;margin-top:20px" onclick="hNext()"><span>下一步 NEXT</span></button>`
  :`<div style="display:flex;gap:14px;align-items:center;margin-top:22px"><div class="bebas" id="clk" style="font-size:34px;color:var(--dk)"></div><button class="btn sm" onclick="hReveal()"><span>揭曉答案 REVEAL</span></button></div>`}`;}
 else if(R.phase==='final'){const ps=PLAYERS;main=`<div class="eyebrow">STAGE 04 · NEXT LEVEL</div><h2 class="qtext">一人一塊，拼出我們的 Human Touch</h2><p>請每位夥伴在手機上寫下「我會留下來的一個日常習慣」。已完成 <b>${ps.filter(p=>p.habit).length}</b> / ${ps.length}</p>
  <div class="puzzle">${ps.map(p=>`<div class="pz ${p.habit?'got':''}">${p.habit?`<b>${esc(p.name)}</b>${esc(p.habit)}`:`🧩 ${esc(p.name)}`}</div>`).join('')}</div>
  <button class="btn" style="max-width:420px;margin-top:24px" onclick="hDone()"><span>完成拼圖 · 簽署 NEXT LEVEL 承諾</span></button>`;}
 else if(R.phase==='done'){return certView();}
 app.innerHTML=`<div class="host"><div class="hmain">${head}${prog}${main}</div>${side()}</div>`;
 drawQR(document.getElementById('qr'),BASE+'?room='+RID);tick();}
function tick(){clearInterval(timerI);if(R.phase!=='question')return;const f=()=>{const el=document.getElementById('clk');if(!el)return;const t=Math.max(0,Math.ceil((R.deadline-Date.now())/1000));el.textContent=t>0?'討論倒數 '+t+'s':'⏰ TIME UP';if(t<=0)clearInterval(timerI);};f();timerI=setInterval(f,500);}
function maybeAuto(){if(!R||R.phase!=='question')return;const k=qkey(R.si,R.qi);const n=new Set(ANS.filter(a=>a.k===k).map(a=>a.pid)).size;if(PLAYERS.length&&n>=PLAYERS.length)setTimeout(()=>{if(R.phase==='question'&&qkey(R.si,R.qi)===k)hReveal();},1200);}
window.hStage=async si=>{const o={phase:'intro',si,qi:0,event:null,hint:null};
 if(STAGES[si].able){const sh=[...PLAYERS].sort(()=>Math.random()-.5);const t={};['t1','t2','t3'].forEach((id,i)=>t[id]=sh[i%sh.length].id);o.tools=t;}
 await upd(o);};
window.hQ=async(si,qi)=>{const st=STAGES[si];let ev=null,sec=R.sec,temp=R.temp;
 if(st.able){ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];if(ev.fx==='busy')sec=30;if(ev.fx==='boost')temp+=20;}
 await upd({phase:'question',si,qi,event:ev,deadline:Date.now()+sec*1000,temp,lastGain:null});};
let revealing=false;
window.hReveal=async()=>{if(revealing||R.phase!=='question')return;revealing=true;const q=STAGES[R.si].q[R.qi],k=qkey(R.si,R.qi);
 const as=ANS.filter(a=>a.k===k);const c=as.filter(a=>a.c===q.a).length;let g=c*10;
 if(R.toolUsed.t2===k)g+=(as.length-c)*5;if(R.toolUsed.t3===k)g*=2;if(R.event?.fx==='mys'&&as.length&&c/as.length>=.6)g+=30;
 const log=[...(R.log||[]),{k,n:as.length,c,g}];await upd({phase:'reveal',temp:R.temp+g,lastGain:{c,g},log});revealing=false;};
window.hNext=()=>{const st=STAGES[R.si];if(R.qi+1<st.q.length)hQ(R.si,R.qi+1);else hStage(R.si+1);};
window.hFinal=()=>upd({phase:'final',event:null});
window.hDone=async()=>{if(!confirm('確認完成並記錄本場成績？'))return;
 const all=await getDocs(collection(db,ROOMS,RID,'answers'));const A=all.docs.map(d=>d.data());
 const players=PLAYERS.map(p=>{const mine=A.filter(a=>a.pid===p.id);const cor=mine.filter(a=>{const[si,qi]=a.k.split('_').map(Number);return STAGES[si].q[qi].a===a.c;}).length;return{name:p.name,role:p.role||'',answered:mine.length,correct:cor,habit:p.habit||''};});
 const tA=players.reduce((s,p)=>s+p.answered,0),tC=players.reduce((s,p)=>s+p.correct,0);
 const rate=tA?Math.round(tC/tA*100):0;
 const res={room:RID,outlet:R.outlet,region:R.region,host:R.host||'',players,playerCount:players.length,rate,temp:R.temp,questions:FLAT.length,completedAt:new Date().toISOString(),createdAt:serverTimestamp()};
 try{await setDoc(doc(db,RESULTS,RID),res);}catch(e){alert('成績寫入失敗：'+e.message);}
 await upd({phase:'done',rate});};
function levelOf(r){return r>=90?'Next Level 傳奇據點':r>=75?'Next Level 達人據點':r>=60?'Next Level 實踐據點':'Next Level 啟程據點';}
function certView(){const d=new Date();const ps=PLAYERS;
 app.innerHTML=`<div class="cert fade"><img class="logo" src="${LOGO}"><div class="eyebrow" style="margin-top:18px">CERTIFICATE OF HUMAN TOUCH · NEXT LEVEL</div>
 <h1>${esc(R.outlet)}</h1><p class="serif" style="font-size:18px">${ps.map(p=>esc(p.name)).join('、')}</p>
 <p style="margin-top:16px;line-height:1.9">攜手完成 WILLING → SKILL → ABLE → NEXT LEVEL 旅程<br>團隊答對率 <b>${R.rate??0}%</b> ｜ 顧客溫度 <b>${R.temp}°</b><br><span class="vtag" style="font-size:16px;margin-top:8px">${levelOf(R.rate??0)}</span></p>
 <ol>${ps.filter(p=>p.habit).map(p=>`<li><b>${esc(p.name)}</b>：${esc(p.habit)}</li>`).join('')}</ol>
 <p class="serif" style="font-style:italic;color:var(--dk)">From Ideas to Habits — 讓每一個打動客戶的小行為，成為我們每天的自然習慣。</p>
 <p style="font-size:12px;margin-top:14px;color:rgba(10,31,24,.5)">${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} · Škoda Auto Taiwan</p></div>
 <div class="noprint" style="max-width:900px;margin:0 auto 40px;display:flex;gap:10px"><button class="btn" onclick="print()"><span>列印證書 PRINT</span></button><button class="btn ghost" onclick="location.href='?board=1'"><span>成績看板 BOARD</span></button></div>`;}

let ME=null,PR=null,myAns={};
async function player(code){
 const s=await getDoc(doc(db,ROOMS,code)).catch(()=>null);if(!s||!s.exists())return H(`<div class="phone"><div class="pcard">找不到房間 <b>${esc(code)}</b>，請確認代碼。</div></div>`);
 const pid=localStorage.getItem('htg_pid_'+code);
 if(pid){ME={id:pid,name:localStorage.getItem('htg_name_'+code)};return pListen(code);}
 const r=s.data();
 H(`<div class="ptop"><img src="${LOGO}"><span class="bebas" style="color:var(--g)">ROOM ${code}</span></div><div class="phone">
 <div class="eyebrow">JOIN · 加入挑戰</div><h2 class="ftitle">${esc(r.outlet)}</h2><p class="hint">輸入你的姓名加入，和夥伴一起破關！</p>
 <div class="field"><label>姓名</label><input id="nm" placeholder="請輸入姓名"></div>
 <div class="field"><label>職務</label><select id="rl"><option>銷售顧問</option><option>服務顧問</option><option>技師</option><option>客休室／接待</option><option>主管</option><option>總公司</option><option>其他</option></select></div>
 <button class="btn" id="jn"><span>加入 JOIN</span></button></div>`);
 document.getElementById('jn').onclick=async()=>{const nm=document.getElementById('nm').value.trim();if(!nm)return alert('請輸入姓名');
  const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  try{await setDoc(doc(db,ROOMS,code,'players',id),{name:nm,role:document.getElementById('rl').value,joinedAt:new Date().toISOString(),habit:''});}catch(e){return alert('加入失敗：'+e.message);}
  localStorage.setItem('htg_pid_'+code,id);localStorage.setItem('htg_name_'+code,nm);ME={id,name:nm};pListen(code);};}
function pListen(code){RID=code;onSnapshot(doc(db,ROOMS,code),s=>{PR=s.data();pRender();});
 onSnapshot(doc(db,ROOMS,code,'players',ME.id),s=>{if(s.exists())ME={id:ME.id,...s.data()};});}
let ptimer=null;
function pRender(){const r=PR;if(!r)return;const st=STAGES[r.si];const top=`<div class="ptop"><img src="${LOGO}"><span class="bebas" style="color:var(--g)">${esc(ME.name)} · ${r.temp}°</span></div>`;let b='';clearInterval(ptimer);
 const myTools=Object.entries(r.tools||{}).filter(([t,p])=>p===ME.id).map(([t])=>t);
 if(r.phase==='lobby')b=`<div class="wait"><span class="dot"></span><h2 class="serif" style="margin:16px 0 8px">已加入 ${esc(r.outlet)}</h2><p>請看大螢幕，等主持人開始挑戰。</p></div>`;
 else if(r.phase==='intro')b=`<div class="pcard"><div class="eyebrow">STAGE ${st.no} · ${st.period}</div><h2 class="serif" style="margin:6px 0">${st.key}｜${st.title}</h2><p style="line-height:1.8;font-size:15px">${st.story}</p></div>
  ${myTools.map(t=>`<div class="toolcard"><b>🎫 你拿到 HT 工具包：${TOOLS[t].name}</b><br><small>${TOOLS[t].fx}<br>題目進行中可為全隊使用一次，和夥伴討論何時用最有效！</small></div>`).join('')}`;
 else if(r.phase==='question'||r.phase==='reveal'){const q=st.q[r.qi],k=qkey(r.si,r.qi),mine=myAns[k],rv=r.phase==='reveal';
  b=`<div class="pcard"><div class="eyebrow">${st.key} · Q${r.qi+1}/${st.q.length}</div>${r.event?`<div class="event" style="margin:10px 0 0;font-size:13px">⚡ ${r.event.t}：${r.event.d}</div>`:''}<p class="serif" style="font-size:18px;font-weight:700;line-height:1.6;margin-top:10px">${q.s}</p><div id="pclk" class="bebas" style="color:var(--dk);margin-top:6px"></div></div>
  <div class="opts" style="margin-top:12px">${q.o.map((o,i)=>{const cut=r.hint&&r.hint.k===k&&r.hint.cut===i;return `<button class="opt ${rv?(i===q.a?'ok':(mine===i?'no':'')):(mine===i?'sel':'')} ${cut?'cut':''}" ${rv||mine!==undefined||cut?'disabled':''} onclick="pAns(${i})"><span class="k">${K[i]}</span><span style="font-size:16px">${o}</span></button>`;}).join('')}</div>`;
  if(!rv&&mine!==undefined)b+=`<div class="wait" style="padding:20px"><span class="dot"></span> 已送出，等待夥伴作答…</div>`;
  if(rv)b+=`<div class="pcard"><div class="res">${mine===q.a?'🎉 答對了！':mine===undefined?'這題沒有作答':'💡 一起學習'}</div>${q.c?`<div class="bebas" style="color:var(--accent)">真實案例 · ${q.c}</div>`:''}<p style="line-height:1.8;margin-top:6px">${q.e}</p></div>`;
  if(!rv&&st.able)b+=myTools.map(t=>r.toolUsed[t]?`<div class="toolcard" style="opacity:.5">🎫 ${TOOLS[t].name}${r.toolUsed[t]===k?'：本題已啟用！':'：已使用'}</div>`:`<button class="btn gold" style="margin-top:14px" onclick="pTool('${t}')"><span>🎫 為全隊使用「${TOOLS[t].name}」</span></button><p style="font-size:12px;margin-top:4px;color:rgba(10,31,24,.6)">${TOOLS[t].fx}</p>`).join('');}
 else if(r.phase==='final'){b=ME.habit?`<div class="pcard"><div class="eyebrow">YOUR PIECE</div><h2 class="serif" style="margin:8px 0">🧩 ${esc(ME.habit)}</h2><p>已放入團隊拼圖，看看大螢幕！</p></div>`:
  `<div class="pcard"><div class="eyebrow">STAGE 04 · NEXT LEVEL</div><h2 class="serif" style="margin:8px 0">我會留下來的一個日常習慣</h2><div class="field"><input id="hb" list="sg" placeholder="輸入或選擇建議"><datalist id="sg">${HABIT_SUG.map(s=>`<option value="${s}">`).join('')}</datalist></div><button class="btn" onclick="pHabit()"><span>放入拼圖 🧩</span></button></div>`;}
 else if(r.phase==='done')b=`<div class="pcard" style="text-align:center"><div class="eyebrow">COMPLETED</div><h2 class="serif" style="margin:10px 0">恭喜 ${esc(r.outlet)}！</h2><p>團隊答對率 <b>${r.rate}%</b>｜顧客溫度 <b>${r.temp}°</b></p><p style="margin-top:10px">${levelOf(r.rate)}</p><p style="margin-top:14px;font-style:italic">From Ideas to Habits</p></div>`;
 app.innerHTML=top+'<div class="phone fade">'+b+'</div>';
 if(r.phase==='question'){const f=()=>{const el=document.getElementById('pclk');if(!el)return;const t=Math.max(0,Math.ceil((r.deadline-Date.now())/1000));el.textContent=t>0?'討論倒數 '+t+'s':'TIME UP · 請盡快作答';};f();ptimer=setInterval(f,500);}}
window.pAns=async i=>{const k=qkey(PR.si,PR.qi);if(myAns[k]!==undefined)return;myAns[k]=i;pRender();
 await setDoc(doc(db,ROOMS,RID,'answers',k+'__'+ME.id),{k,pid:ME.id,c:i,at:new Date().toISOString()});};
window.pTool=async t=>{const k=qkey(PR.si,PR.qi);if(PR.toolUsed[t])return;if(!confirm('確定為全隊使用「'+TOOLS[t].name+'」？每個工具包只能用一次。'))return;
 const o={['toolUsed.'+t]:k};if(t==='t1'){const q=STAGES[PR.si].q[PR.qi];const w=[0,1,2].filter(i=>i!==q.a);o.hint={k,cut:w[Math.floor(Math.random()*w.length)]};}
 await updateDoc(doc(db,ROOMS,RID),o);};
window.pHabit=async()=>{const v=document.getElementById('hb').value.trim();if(!v)return alert('請寫下一個具體的習慣');await updateDoc(doc(db,ROOMS,RID,'players',ME.id),{habit:v});ME.habit=v;pRender();};

let RES=[];
async function board(){H(`<div class="board"><div class="wait"><span class="dot"></span> 載入成績中…</div></div>`);
 try{const s=await getDocs(collection(db,RESULTS));RES=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));}catch(e){return H(`<div class="board"><div class="card">讀取失敗：${esc(e.message)}</div></div>`);}
 const by={};RES.forEach(r=>{(by[r.outlet]=by[r.outlet]||[]).push(r);});
 const allNames=new Set();RES.forEach(r=>r.players.forEach(p=>allNames.add(r.outlet+'|'+p.name)));
 const outlets=OUTLET_GROUPS.flatMap(g=>g.items);const joined=Object.keys(by).length;
 const avg=RES.length?Math.round(RES.reduce((s,r)=>s+r.rate,0)/RES.length):0;
 let rows='';OUTLET_GROUPS.forEach(g=>{rows+=`<tr class="rg"><td colspan="7">${g.region}</td></tr>`;
  g.items.forEach(o=>{const L=by[o]||[];if(!L.length){if(o!=='其他'&&!o.startsWith('總公司'))rows+=`<tr class="zero"><td>${o}</td><td>0</td><td>0</td><td>—</td><td>—</td><td>—</td><td>尚未參加</td></tr>`;return;}
   const names=[...new Set(L.flatMap(r=>r.players.map(p=>p.name)))];const best=Math.max(...L.map(r=>r.temp));const ra=Math.round(L.reduce((s,r)=>s+r.rate,0)/L.length);
   rows+=`<tr><td><b>${o}</b></td><td>${L.length}</td><td>${names.length}</td><td>${ra}%</td><td>${best}°</td><td>${L[0].completedAt.slice(0,10)}</td><td class="names">${names.map(esc).join('、')}</td></tr>`;});});
 H(`<div class="board"><div style="display:flex;justify-content:space-between;align-items:center"><img class="logo" style="background:var(--deep);padding:10px 18px;width:200px" src="${LOGO}"><div class="noprint" style="display:flex;gap:8px"><button class="btn sm" onclick="csv()"><span>匯出 CSV</span></button><button class="btn sm ghost" onclick="location.href='?'"><span>首頁</span></button></div></div>
 <div class="eyebrow" style="margin-top:24px">NEXT LEVEL CHALLENGE · DASHBOARD</div><h1 class="ftitle" style="font-size:34px">各據點成績看板</h1>
 <div class="kpis"><div class="kpi"><div class="lbl">參與據點</div><div class="big">${joined}<small style="font-size:22px">/${outlets.length-2}</small></div></div><div class="kpi"><div class="lbl">挑戰場次</div><div class="big">${RES.length}</div></div><div class="kpi"><div class="lbl">參加人次（據點×姓名）</div><div class="big">${allNames.size}</div></div><div class="kpi"><div class="lbl">平均答對率</div><div class="big">${avg}%</div></div></div>
 <table><thead><tr><th>據點</th><th>場次</th><th>參加人數</th><th>平均答對率</th><th>最高顧客溫度</th><th>最近一場</th><th>參加人員</th></tr></thead><tbody>${rows}</tbody></table>
 <h2 class="ftitle" style="font-size:24px;margin-top:40px">場次明細</h2>
 <table><thead><tr><th>日期</th><th>據點</th><th>主持人</th><th>人數</th><th>答對率</th><th>溫度</th><th>參加人員（答對／作答）· 日常習慣</th></tr></thead><tbody>
 ${RES.map(r=>`<tr><td>${r.completedAt.slice(0,16).replace('T',' ')}</td><td>${esc(r.outlet)}</td><td>${esc(r.host)}</td><td>${r.playerCount}</td><td><span class="pill">${r.rate}%</span></td><td>${r.temp}°</td><td class="names">${r.players.map(p=>`<b>${esc(p.name)}</b>（${esc(p.role)}）${p.correct}/${p.answered}${p.habit?' · '+esc(p.habit):''}`).join('<br>')}</td></tr>`).join('')||'<tr><td colspan="7">尚無紀錄</td></tr>'}</tbody></table></div>`);}
window.csv=()=>{const L=[['日期','區域','據點','房間','主持人','姓名','職務','作答題數','答對題數','團隊答對率','團隊顧客溫度','日常習慣']];
 RES.forEach(r=>r.players.forEach(p=>L.push([r.completedAt,r.region,r.outlet,r.room,r.host,p.name,p.role,p.answered,p.correct,r.rate,r.temp,p.habit])));
 const t='\ufeff'+L.map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='HT_NextLevel_成績_'+new Date().toISOString().slice(0,10)+'.csv';a.click();};

if(params.get('room'))player(params.get('room').toUpperCase());
else if(params.get('host')){const h=params.get('host');gate(()=>h==='1'?hostSetup():hostRun(h.toUpperCase()));}
else if(params.get('board'))gate(board);
else home();
</script></body></html>
