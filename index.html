 {s:'交車勤務回程，在偏僻的農田路段瞥見路邊好像有人倒在水溝裡，車已經開過去了。下列哪個做法最正確且完整？',o:['趕時間回廠，請同事打 110 就好','立刻把人用力拉出水溝，直接載去醫院','掉頭回去；先確認意識、哪裡痛、手腳能否活動、是否需要救護車，再慢慢協助離開水溝，並向廠長報備','先拍照記錄現場，以免日後有爭議'],a:2,v:'Human',c:'偕聖沙鹿｜蘇偉哲（Q3 服務第 1 名）',e:'多看一眼、願意回頭，再用正確的步驟幫忙。阿嬤的兒子最後記住了：SKODA。'},
 {s:'四年前一對盼望孩子的夫妻買了 KODIAQ。四年後的預產期當天，先生傳訊息說臨時需要幫忙去醫院。讓這一刻「他會想到找你」的關鍵是什麼？',o:['四年來定期推銷新車款','交車時給了很大的折扣','四年間沒有壓力的關心，以及一句「需要幫忙請一定告訴我」','有 24 小時道路救援專線'],a:2,v:'Human',c:'榮陞平鎮｜林昭博',e:'信任是長期累積的；他放下手邊工作載夫妻去醫院——客戶成了朋友，甚至家人。'},
 {s:'陳小姐的狗狗一個月前當了小天使，車上後座還留著牠的毛。保養時你注意到這件事，最有溫度的處理是？',o:['照常吸乾淨，什麼都不提','怕她難過，後座乾脆不清','照常清潔，但把狗毛收進小袋，交車時交給她留念','建議她加購深層清潔方案'],a:2,v:'Surprising',c:'喬順北投｜陳曉雯',e:'不多花錢，只是感受到她的心情——當晚先生特地打電話來道謝。'},
 {s:'一位外籍牙醫試乘時一直擦汗、手微微發抖，對買車興趣不高。若你判斷是「家鄉右駕、對台灣左駕很有壓力」，哪個做法最能真正解決問題？',o:['推薦有更多駕駛輔助的高階車型','建議他請司機就好','找到有外籍人士課程的駕訓班、陪他報名，一個月後再邀試乘','先讓他簽約，交車時再教他開'],a:2,v:'Human',c:'偕聖豐原｜陳奕帆',e:'先解決客戶真正的擔心，而不是急著賣車——他後來開心地自己簽約。'},
 {s:'中午休息時間，一台「非 Škoda」的車排氣管在雨中脫落，車主剛被隔壁品牌的服務廠拒絕。你的第一句話最好是？',o:['「不好意思，我們只服務 Škoda」','「你先別急，我們過去看看怎麼幫你」','「我給你拖吊公司的電話」','「下午一點半開工後再來」'],a:1,v:'Human',c:'喬順北投｜林奕霆、白金明',e:'技師在雨中先暫時固定、再進廠檢查說明，沒有收費。車主說：換車時絕不會忘記 Škoda。'},
 {s:'客休室裡一位 8 歲的孩子停不下來跑來跑去，媽媽很尷尬、一直向其他客人道歉。哪個做法同時照顧到「媽媽、孩子、其他客人」？',o:['委婉提醒媽媽管好孩子','把孩子帶到展間，讓他自己玩','邀孩子一起動手做熱壓吐司，讓他專注半小時','提供平板讓孩子看影片'],a:2,v:'Simplifying',c:'喬順北投｜陳渼媛',e:'孩子專心、客休室恢復安靜、媽媽終於能休息——這是對媽媽最大的幫忙。'},
 {s:'儀表板亮燈的車主進廠，一邊看手錶一邊顯得很焦急。服務顧問的第一句話，哪一句最能「先處理人、再處理車」？',o:['「請先到客休室等候，我們檢查完會報價」','「您現在最擔心的是車子，還是時間趕不上？」','「這個燈很常見，應該沒什麼問題」','「今天工單比較多，可能要等兩小時」'],a:1,v:'Simplifying',c:'金元三新莊｜陳章豪',e:'先問出客戶真正的擔心，再安排最省時的處理方式——客戶感受到的是被理解。'}
 ]},
{key:'ABLE',no:'03',title:'能力',period:'2026 Q4',able:true,story:'從 10 月開始，每個據點自選一項行為創想：選擇、規劃、執行、檢視與改善，最後沉澱為日常。再加上三張「QR Code 聯絡卡」工具包——讓客戶記得你、找得到對的人。',
 q:[
 {s:'「從一項行為創想，走向持續改善」的四個步驟，正確順序是？',o:['執行 → 選擇 → 規劃 → 檢視與改善','選擇 → 規劃 → 執行 → 檢視與改善','規劃 → 選擇 → 檢視與改善 → 執行','選擇 → 執行 → 規劃 → 檢視與改善'],a:1,e:'選擇一項具體行為 → 定義做法、分工與預期成果 → 在真實接觸點落實並記錄 → 回顧成效、調整並納入日常。'},
 {s:'據點常有帶嬰幼兒與孕婦的家庭來商談，家長常分心、坐不住。這個月要選哪一項行為創想最貼近據點的真實痛點？',o:['準備兒童畫具、積木與孕婦靠枕','請家長下次改約平日、不帶小孩','加快講解速度，早點結束','加碼送兒童安全座椅'],a:0,v:'Human',c:'永驊鳳山｜10 月行為創想',e:'依自己據點顧客的真實痛點選題，而不是照表抄做。'},
 {s:'執行後發現：嬰幼兒仍容易哭鬧，玩具只對大一點的孩子有效。紀錄表與下一步，哪個組合最好？',o:['紀錄寫「無特殊狀況」，下個月換別的題目','誠實寫下問題，依年齡準備不同玩具或點心，下個月再驗證','直接放棄這個行為創想','只在週末執行，平日不做'],a:1,v:'Simplifying',e:'最有價值的報告，是寫出問題並願意調整的報告——發現 → 修正 → 再驗證，這就是學習。'},
 {s:'交車時拍下客戶與家人的合照，現場洗出實體照片相贈。這個行為創想最主要對應哪個核心價值？為什麼？',o:['Simplifying：讓交車流程更快','Surprising：成本低、在交車當下創造超越期待的記憶點','Human：因為有拍照','Simplifying：照片可以取代交車文件'],a:1,v:'Surprising',c:'偕聖豐原｜10 月行為創想',e:'用很小的成本，在情緒最高的交車時刻留下一份帶得走的回憶。'},
 {s:'離店前確認客戶最在意的 3 個重點，並用 LINE 傳送摘要、作為後續追蹤主軸。這個做法的價值主要在於？',o:['讓業務有理由每天傳訊息','減輕客戶資訊負擔，讓後續追蹤聚焦在客戶真正在意的事','增加 LINE 好友數','取代試乘'],a:1,v:'Simplifying',c:'吉揚竹北｜10 月行為創想',e:'Simplifying：替客戶整理，而不是丟更多資訊給客戶。'},
 {s:'雨天雙傘迎賓。這個行為創想真正的關鍵原則是什麼？',o:['傘一定要是品牌傘','不論客戶要不要，一律幫他撐傘','先詢問、尊重客戶的選擇，再提供協助','要有兩個人同時出去迎接'],a:2,v:'Human',c:'榮陞平鎮｜10 月行為創想',e:'Human Touch 不是「做很多」，而是「做對方需要的」。'},
 {s:'交車後第 3 天、第 7 天、一個月主動關心，若有異常即協調服務廠並追蹤到結案。這個做法比「交車後有空打個電話」更進一步的地方是？',o:['打電話的次數比較多','從一份好意，進化成有固定節點、有閉環的機制','可以順便推銷配件','可以提高 Follow Up 分數就好'],a:1,v:'Human',c:'永驊永康｜10 月行為創想',e:'有節點、有負責人、有結案——好意才會變成每個人都做得到的日常。'},
 {s:'2026 Q3 神秘客：全網「試乘 C6 體驗重點」落實度只有 35%。下列哪一個行為最直接對症？',o:['試乘後多送一份小禮物','延長試乘時間到一小時','試乘前說明路線、體驗重點與注意事項，並預先設定好客戶想試的功能','試乘時多介紹車價方案'],a:2,v:'Simplifying',e:'Simplifying：前置作業到位、讓客戶知道要「體驗什麼」。還可以加上 Human（備水、合適的音樂）與 Surprising（專屬歡迎小卡）。'},
 {tool:'t1',s:'神秘客也發現「自我介紹」「配戴名牌」落實度偏低。製作照片桌牌 2.0 時，照片最建議呈現什麼？',o:['正式的證件大頭照','個人的旅遊生活照','你與 Škoda 的連結，例如和你最愛的車型合照','不需要照片，有 QR Code 就好'],a:2,v:'Human',e:'照片桌牌 2.0：用 Škoda Templates 網頁產生器製作，照片呈現你與 Škoda 的連結——讓客戶記住你的臉。'},
 {tool:'t2',s:'售後服務聯絡卡要真正落地，哪一個步驟順序正確？',o:['交車時請客戶自己上官網找售服電話','製作售服夥伴 vCard QR Code → 銷售將它存在手機 → 納入交車流程，當面引薦售服聯絡人','等客戶第一次回廠時再給售服名片','由總機統一轉接即可'],a:1,v:'Simplifying',e:'銷售 → 售後的交接，在交車那一刻就完成；客戶免搜尋就找得到對的人。'},
 {tool:'t3',s:'售服夥伴遞上「銷售顧問聯絡卡」，下列哪一個時機最恰當？',o:['每次保養結帳時都遞一張','客戶剛抱怨維修費太貴的時候','大修或高里程，客戶可能開始考慮換車時','客戶一進廠就先遞上'],a:2,v:'Human',e:'在對的時機自然引薦，並介紹銷售顧問的姓名、鼓勵諮詢——服務與銷售無縫合作。'},
 {s:'售後服務的 Human Touch 流程共有四個階段。客戶常抱怨「等待時不知道車子進度」，應該在哪個階段、用什麼行為改善？',o:['1. 預約與準備：預約時說明大約所需時間','3. 服務執行：主動、定時更新維修進度','4. 車輛歸還：結帳時一次說明所有內容','2. 車輛進廠：請客戶留下電話就好'],a:1,v:'Simplifying',e:'售後 4 流程：預約與準備 → 車輛進廠 → 服務執行 → 車輛歸還。等待中的不安，要在「服務執行」階段主動化解。'}
 ]},

let shuffled=false;
function applyShuffle(code){if(shuffled)return;shuffled=true;let seed=[...code].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
 const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
 STAGES.forEach(s=>s.q.forEach(q=>{const p=q.o.map((_,i)=>i);for(let i=p.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[p[i],p[j]]=[p[j],p[i]];}q.o=p.map(i=>q.o[i]);q.a=p.indexOf(q.a);}));}

 const f=()=>{if(document.getElementById('pw').value.trim()===pwd){sessionStorage.setItem(key,'1');next();}else document.getElementById('er').textContent='密碼不正確';};
 document.getElementById('go').onclick=f;document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')f();};}
function drawQR(el,text){if(!el||typeof qrcode==='undefined')return;const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),cs=8,m=4,size=(n+m*2)*cs;
 const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);x.fillStyle='#042B1F';
 for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+m)*cs,(r+m)*cs,cs,cs);el.innerHTML='';el.appendChild(c);}

window.pHabit=async()=>{const v=document.getElementById('hb').value.trim();if(!v)return alert('請寫下一個具體的習慣');await updateDoc(doc(db,ROOMS,RID,'players',ME.id),{habit:v});ME.habit=v;pRender();};

let RES=[];
async function board(){H(`<div class="board"><div class="wait"><span class="dot"></span> 載入成績中…</div></div>`);
 try{const s=await getDocs(collection(db,RESULTS));RES=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));}catch(e){return H(`<div class="board"><div class="card">讀取失敗：${esc(e.message)}</div></div>`);}
 const by={};RES.forEach(r=>{(by[r.outlet]=by[r.outlet]||[]).push(r);});
 const allNames=new Set();RES.forEach(r=>r.players.forEach(p=>allNames.add(r.outlet+'|'+p.name)));
 const outlets=OUTLET_GROUPS.flatMap(g=>g.items);const joined=Object.keys(by).length;
 const avg=RES.length?Math.round(RES.reduce((s,r)=>s+r.rate,0)/RES.length):0;
 let rows='';OUTLET_GROUPS.forEach(g=>{rows+=`<tr class="rg"><td colspan="7">${g.region}</td></tr>`;
  g.items.forEach(o=>{const L=by[o]||[];if(!L.length){if(o!=='其他'&&!o.startsWith('總公司'))rows+=`<tr class="zero"><td>${o}</td><td>0</td><td>0</td><td>—</td><td>—</td><td>—</td><td>尚未參加</td></tr>`;return;}
   const names=[...new Set(L.flatMap(r=>r.players.map(p=>p.name)))];const best=Math.max(...L.map(r=>r.temp));const ra=Math.round(L.reduce((s,r)=>s+r.rate,0)/L.length);
   rows+=`<tr><td><b>${o}</b></td><td>${L.length}</td><td>${names.length}</td><td>${ra}%</td><td>${best}°</td><td>${L[0].completedAt.slice(0,10)}</td><td class="names">${names.map(esc).join('、')}</td></tr>`;});});
 H(`<div class="board"><div style="display:flex;justify-content:space-between;align-items:center"><div style="background:var(--deep);padding:12px 20px"><img style="width:190px;display:block" src="${LOGO}"></div><div class="noprint" style="display:flex;gap:8px"><button class="btn sm" onclick="csv()"><span>匯出 CSV</span></button><button class="btn sm ghost" onclick="board()"><span>重新整理</span></button></div></div>
 <div class="eyebrow" style="margin-top:24px">NEXT LEVEL CHALLENGE · ADMIN DASHBOARD</div><h1 class="ftitle" style="font-size:34px">各據點成績看板</h1>
 <div class="kpis"><div class="kpi"><div class="lbl">參與據點</div><div class="big">${joined}<small style="font-size:22px">/${outlets.length-2}</small></div></div><div class="kpi"><div class="lbl">挑戰場次</div><div class="big">${RES.length}</div></div><div class="kpi"><div class="lbl">參加人數（據點×姓名）</div><div class="big">${allNames.size}</div></div><div class="kpi"><div class="lbl">平均答對率</div><div class="big">${avg}%</div></div></div>
 <table><thead><tr><th>據點</th><th>場次</th><th>參加人數</th><th>平均答對率</th><th>最高顧客溫度</th><th>最近一場</th><th>參加人員</th></tr></thead><tbody>${rows}</tbody></table>
 <h2 class="ftitle" style="font-size:24px;margin-top:40px">場次明細</h2>
 <table><thead><tr><th>日期</th><th>據點</th><th>主持人</th><th>人數</th><th>答對率</th><th>溫度</th><th>參加人員（答對／作答）· 日常習慣</th></tr></thead><tbody>
 ${RES.map(r=>`<tr><td>${r.completedAt.slice(0,16).replace('T',' ')}</td><td>${esc(r.outlet)}</td><td>${esc(r.host)}</td><td>${r.playerCount}</td><td><span class="pill">${r.rate}%</span></td><td>${r.temp}°</td><td class="names">${r.players.map(p=>`<b>${esc(p.name)}</b>（${esc(p.role)}）${p.correct}/${p.answered}${p.habit?' · '+esc(p.habit):''}`).join('<br>')}</td></tr>`).join('')||'<tr><td colspan="7">尚無紀錄</td></tr>'}</tbody></table></div>`);}
window.board=board;
window.csv=()=>{const L=[['日期','區域','據點','房間','主持人','姓名','職務','作答題數','答對題數','團隊答對率','團隊顧客溫度','日常習慣']];
 RES.forEach(r=>r.players.forEach(p=>L.push([r.completedAt,r.region,r.outlet,r.room,r.host,p.name,p.role,p.answered,p.correct,r.rate,r.temp,p.habit])));
 const t='\ufeff'+L.map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='HT_NextLevel_成績_'+new Date().toISOString().slice(0,10)+'.csv';a.click();};

if(params.get('room'))player(params.get('room').toUpperCase());
else if(params.get('host')){const h=params.get('host');gate('htg_host',HOST_PWD,'DQM · 主持人入口',()=>h==='1'?hostSetup():hostRun(h.toUpperCase()));}
else if(params.get('admin'))gate('htg_admin',BOARD_PWD,'ADMIN · 成績看板',board);
else home();
</script></body></html>
