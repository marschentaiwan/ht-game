 tone(f,d,type,v,f2){if(!this.c)return;try{const t=this.c.currentTime,o=this.c.createOscillator(),g=this.c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(this.c.destination);o.start(t);o.stop(t+d);}catch(e){}},
 noise(d,v){if(!this.c)return;try{const n=Math.floor(this.c.sampleRate*d),b=this.c.createBuffer(1,n,this.c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=this.c.createBufferSource(),g=this.c.createGain();g.gain.value=v||.3;s.buffer=b;s.connect(g);g.connect(this.c.destination);s.start();}catch(e){}},
 beep(f,d){this.tone(f,d,'square',.2)},
 honk(){this.tone(392,.4,'sawtooth',.18);this.tone(494,.4,'sawtooth',.14)},
 crash(){this.noise(.5,.45);this.tone(200,.5,'sawtooth',.2,40)},
 boost(){this.tone(300,.45,'sawtooth',.13,1400)},
 alert(){[660,880,660,880].forEach((f,i)=>setTimeout(()=>this.tone(f,.14,'triangle',.22),i*140))},
 dog(){[950,720,950,720].forEach((f,i)=>setTimeout(()=>this.tone(f,.13,'square',.16,f*.7),i*170))},
 cheer(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.tone(f,.32,'triangle',.24),i*130));setTimeout(()=>this.noise(1.3,.16),520)},
 click(){this.tone(1300,.03,'square',.04)}

let shuffled=false;
function applyShuffle(code){if(shuffled)return;shuffled=true;let seed=[...code].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
 const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
 STAGES.forEach(s=>s.q.forEach(q=>{const p=q.o.map((_,i)=>i);for(let i=p.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[p[i],p[j]]=[p[j],p[i]];}q.o=p.map(i=>q.o[i]);q.a=p.indexOf(q.a);}));}

 const f=()=>{if(document.getElementById('pw').value.trim()===pwd){sessionStorage.setItem(key,'1');next();}else document.getElementById('er').textContent='密碼不正確';};
 document.getElementById('go').onclick=f;document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')f();};}
function drawQR(el,text){if(!el||typeof qrcode==='undefined')return;const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),cs=8,m=4,size=(n+m*2)*cs;
 const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);x.fillStyle='#042B1F';
 for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+m)*cs,(r+m)*cs,cs,cs);el.innerHTML='';el.appendChild(c);}

function myToolCard(t){const v=TOOLS[t];return `<div class="toolcard"><h4>${v.icon} 你拿到 HT 工具包：${v.name}</h4>
 <div><b>現場怎麼用：</b>${v.real}</div><div><b>遊戲效果：</b>${v.fxLong}</div>
 <div style="margin-top:6px"><b>怎麼用：</b>題目進行中，手機下方會出現金色按鈕，按下即為<b>全隊</b>啟用，只能用一次。看到題目標示「🎫 ${v.name}」時使用，額外 <b>+${TOOL_BONUS}° 用對時機</b>！</div></div>`;}
function pRender(){const r=PR;if(!r)return;if(r.phase==='race'&&RS.key===r.raceStart&&document.getElementById('gasb'))return;const st=STAGES[r.si];const top=`<div class="ptop"><img src="${LOGO}"><span class="bebas" style="color:var(--g)">${esc(ME.name)} · ${r.temp}°</span></div>`;let b='';clearInterval(ptimer);
 const myTools=Object.entries(r.tools||{}).filter(([t,p])=>p===ME.id).map(([t])=>t);
 if(r.phase==='lobby')b=`<div class="wait"><span class="dot"></span><h2 class="serif" style="margin:16px 0 8px">已加入 ${esc(r.outlet)}</h2><p>請看大螢幕，等主持人開始挑戰。</p></div>`;
 else if(r.phase==='intro')b=`<div class="pcard"><div class="eyebrow">STAGE ${st.no} · ${st.period}</div><h2 class="serif" style="margin:6px 0">${st.key}｜${st.title}</h2><p style="line-height:1.8;font-size:15px">${st.story}</p></div>${myTools.map(myToolCard).join('')}`;
 else if(r.phase==='tools')b=`${myTools.length?myTools.map(myToolCard).join(''):`<div class="pcard"><div class="eyebrow">HT TOOLS</div><p style="line-height:1.7;margin-top:6px">這次工具包沒有發到你手上，但你可以和持有人一起討論：<b>哪一題用最划算？</b></p></div>`}
  ${Object.values(TOOLS).map(v=>`<div class="mini"><b>${v.icon} ${v.name}</b>（${v.stage}）<br>${v.real}<br>🎮 ${v.fx}</div>`).join('')}`;
 else if(r.phase==='question'||r.phase==='reveal'){const q=st.q[r.qi],k=qkey(r.si,r.qi),mine=myAns[k],rv=r.phase==='reveal';
  b=`<div class="pcard"><div class="eyebrow">${st.key} ${st.title} · Q${r.qi+1}/${st.q.length}</div>${r.event?`<div class="event" style="margin:10px 0 0;font-size:13px">⚡ ${r.event.t}：${r.event.d}</div>`:''}${q.tool&&!rv?`<div class="toolhint" style="font-size:13px">🎫 本題對應「${TOOLS[q.tool].name}」</div>`:''}<p class="serif" style="font-size:17px;font-weight:700;line-height:1.6;margin-top:10px">${q.s}</p><div id="pclk" class="bebas" style="color:var(--dk);margin-top:6px"></div></div>
  <div class="opts" style="margin-top:12px">${q.o.map((o,i)=>{const cut=r.hint&&r.hint.k===k&&r.hint.cut===i;return `<button class="opt ${rv?(i===q.a?'ok':(mine===i?'no':'')):(mine===i?'sel':'')} ${cut?'cut':''}" ${rv||mine!==undefined||cut?'disabled':''} onclick="pAns(${i})"><span class="k">${K[i]}</span><span style="font-size:15px">${o}</span></button>`;}).join('')}</div>`;
  if(!rv&&mine!==undefined)b+=`<div class="wait" style="padding:18px"><span class="dot"></span> 已送出，等待夥伴作答…</div>`;
  if(rv)b+=`<div class="pcard"><div class="res">${mine===q.a?'🎉 答對了！':mine===undefined?'這題沒有作答':'💡 一起學習'}</div>${q.c?`<div class="bebas" style="color:#B57A10">真實案例 · ${q.c}</div>`:''}<p style="line-height:1.8;margin-top:6px">${q.e}</p></div>`;
  if(!rv&&st.able)b+=myTools.map(t=>r.toolUsed[t]?`<div class="toolcard" style="opacity:.55">${TOOLS[t].icon} ${TOOLS[t].name}${r.toolUsed[t]===k?'：本題已啟用！':'：已使用'}</div>`:`<button class="btn gold" style="margin-top:14px" onclick="pTool('${t}')"><span>${TOOLS[t].icon} 為全隊使用「${TOOLS[t].name}」</span></button><p style="font-size:12px;margin-top:4px;color:rgba(10,31,24,.65)">效果：${TOOLS[t].fx}${q.tool===t?'｜✨ 本題正是使用情境，額外 +'+TOOL_BONUS+'°':''}</p>`).join('');}
 else if(r.phase==='race_pick'){b=`<div class="pcard"><div class="eyebrow">ŠKODA RACE · 選車</div><h2 class="serif" style="margin:6px 0">選一台你的 Škoda</h2><p style="font-size:14px;line-height:1.7">狂點油門累積 COMBO！「客戶時刻」3 秒內選對 → TURBO；選錯或太慢 → 車子故障！小心狗狗、大雨、爆胎…還有喇叭可以按 📯</p></div>
  <div class="cgrid">${CARS.map(c=>`<button class="cbtn ${ME.car===c.id?'on':''}" onclick="pCar('${c.id}')">${carSVG(c.c,90)}<b>${c.name}</b></button>`).join('')}</div>
  ${ME.car?`<div class="wait" style="padding:18px"><span class="dot"></span> 已選 ${carOf(ME.car).name}，等待主持人開始比賽…（手機請開聲音 🔊）</div>`:''}`;}
 else if(r.phase==='race'){if(RS.key!==r.raceStart)raceReset(r.raceStart);const c=carOf(ME.car);
  b=`<div class="pcard" style="text-align:center;padding:14px"><div style="display:flex;justify-content:space-between;align-items:center">${carSVG(c.c,90)}<div class="cd" id="pcd" style="font-size:50px"></div></div>
  <div style="background:rgba(10,31,24,.1);height:14px;margin-top:8px;position:relative"><i id="rbar" style="position:absolute;left:0;top:0;bottom:0;background:var(--g);width:0"></i></div>
  <div id="rtxt" class="bebas" style="margin-top:6px"></div><div id="combo" class="combo"></div><div id="rmsg" style="min-height:24px;font-weight:700;color:#B57A10"></div></div>
  <button class="gas" id="gasb" onpointerdown="pGas(event)">GAS 油門</button>
  <button class="horn" onpointerdown="pHonk(event)">📯 按喇叭（不會變快，純搞笑）</button>`;}
 else if(r.phase==='race_done'){const rk=(r.race&&r.race.rank)||[];const my=rk.findIndex(x=>x.id===ME.id);const myAw=((r.race&&r.race.awards)||[]).filter(a=>a.id===ME.id);
  b=`<div class="pcard" style="text-align:center"><div class="eyebrow">ŠKODA RACE · RESULT</div><div class="res">${my>=0&&my<3?['🥇','🥈','🥉'][my]+' 第 '+(my+1)+' 名！':my>=0?'第 '+(my+1)+' 名 · 辛苦了！':'比賽結束'}</div>
  ${myAw.map(a=>`<div style="font-size:20px;margin:6px 0">${a.ic} 你獲得 <b>${a.t}</b>！</div>`).join('')}
  <p>團隊顧客溫度 +${r.race?.bonus??0}°</p><p style="margin-top:8px">接下來一起拼出我們的 Human Touch 🧩</p></div>`;}
 else if(r.phase==='final'){b=ME.habit?`<div class="pcard"><div class="eyebrow">YOUR PIECE</div><h2 class="serif" style="margin:8px 0">🧩 ${esc(ME.habit)}</h2><p>已放入團隊拼圖，看看大螢幕！</p></div>`:
  `<div class="pcard"><div class="eyebrow">STAGE 04 · NEXT LEVEL 評估優化</div><h2 class="serif" style="margin:8px 0">我會留下來的一個日常習慣</h2><div class="field"><input id="hb" list="sg" placeholder="輸入或選擇建議"><datalist id="sg">${HABIT_SUG.map(s=>`<option value="${s}">`).join('')}</datalist></div><button class="btn" onclick="pHabit()"><span>放入拼圖 🧩</span></button></div>`;}
 else if(r.phase==='done')b=`<div class="pcard" style="text-align:center"><div class="eyebrow">COMPLETED</div><h2 class="serif" style="margin:10px 0">恭喜 ${esc(r.outlet)}！</h2><p>團隊答對率 <b>${r.rate}%</b>｜顧客溫度 <b>${r.temp}°</b></p><p style="margin-top:10px">${levelOf(r.rate)}</p><p style="margin-top:14px;font-style:italic">From Ideas to Habits</p></div>`;
 app.innerHTML=top+'<div class="phone fade">'+b+'</div>';
 if(r.phase==='race'){raceUI();raceTick();}else{clearInterval(RS.wI);closeOv();}
 if(r.phase==='question'){const f=()=>{const el=document.getElementById('pclk');if(!el)return;const t=Math.max(0,Math.ceil((r.deadline-Date.now())/1000));el.textContent=t>0?'討論倒數 '+t+'s':'TIME UP · 請盡快作答';};f();ptimer=setInterval(f,500);}}
window.pAns=async i=>{const k=qkey(PR.si,PR.qi);if(myAns[k]!==undefined)return;myAns[k]=i;pRender();
 await setDoc(doc(db,ROOMS,RID,'answers',k+'__'+ME.id),{k,pid:ME.id,c:i,at:new Date().toISOString()});};
window.pTool=async t=>{const k=qkey(PR.si,PR.qi);if(PR.toolUsed[t]||PR.phase!=='question')return;if(!confirm('確定為全隊使用「'+TOOLS[t].name+'」？\n效果：'+TOOLS[t].fx+'\n每個工具包只能用一次。'))return;
 const o={['toolUsed.'+t]:k};if(t==='t1'){const q=STAGES[PR.si].q[PR.qi];const w=q.o.map((_,i)=>i).filter(i=>i!==q.a);o.hint={k,cut:w[Math.floor(Math.random()*w.length)]};}
 await updateDoc(doc(db,ROOMS,RID),o);};
window.pHabit=async()=>{const v=document.getElementById('hb').value.trim();if(!v)return alert('請寫下一個具體的習慣');await updateDoc(doc(db,ROOMS,RID,'players',ME.id),{habit:v});ME.habit=v;pRender();};

let RES=[];
async function board(){H(`<div class="board"><div class="wait"><span class="dot"></span> 載入成績中…</div></div>`);
 try{const s=await getDocs(collection(db,RESULTS));RES=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));}catch(e){return H(`<div class="board"><div class="card">讀取失敗：${esc(e.message)}</div></div>`);}
 const by={};RES.forEach(r=>{(by[r.outlet]=by[r.outlet]||[]).push(r);});
 const allNames=new Set();RES.forEach(r=>r.players.forEach(p=>allNames.add(r.outlet+'|'+p.name)));
 const outlets=OUTLET_GROUPS.flatMap(g=>g.items);const joined=Object.keys(by).length;
 const avg=RES.length?Math.round(RES.reduce((s,r)=>s+r.rate,0)/RES.length):0;
 let rows='';OUTLET_GROUPS.forEach(g=>{rows+=`<tr class="rg"><td colspan="7">${g.region}</td></tr>`;
  g.items.forEach(o=>{const L=by[o]||[];if(!L.length){if(o!=='其他'&&!o.startsWith('總公司'))rows+=`<tr class="zero"><td>${o}</td><td>0</td><td>0</td><td>—</td><td>—</td><td>—</td><td>尚未參加</td></tr>`;return;}
   const names=[...new Set(L.flatMap(r=>r.players.map(p=>p.name)))];const best=Math.max(...L.map(r=>r.temp));const ra=Math.round(L.reduce((s,r)=>s+r.rate,0)/L.length);
   rows+=`<tr><td><b>${o}</b></td><td>${L.length}</td><td>${names.length}</td><td>${ra}%</td><td>${best}°</td><td>${L[0].completedAt.slice(0,10)}</td><td class="names">${names.map(esc).join('、')}</td></tr>`;});});
 H(`<div class="board"><div style="display:flex;justify-content:space-between;align-items:center"><div style="background:var(--deep);padding:12px 20px"><img style="width:190px;display:block" src="${LOGO}"></div><div class="noprint" style="display:flex;gap:8px"><button class="btn sm" onclick="csv()"><span>匯出 CSV</span></button><button class="btn sm ghost" onclick="board()"><span>重新整理</span></button></div></div>
 <div class="eyebrow" style="margin-top:24px">NEXT LEVEL CHALLENGE · ADMIN DASHBOARD</div><h1 class="ftitle" style="font-size:34px">各據點成績看板</h1>
 <div class="kpis"><div class="kpi"><div class="lbl">參與據點</div><div class="big">${joined}<small style="font-size:22px">/${outlets.length-2}</small></div></div><div class="kpi"><div class="lbl">挑戰場次</div><div class="big">${RES.length}</div></div><div class="kpi"><div class="lbl">參加人數（據點×姓名）</div><div class="big">${allNames.size}</div></div><div class="kpi"><div class="lbl">平均答對率</div><div class="big">${avg}%</div></div></div>
 <table><thead><tr><th>據點</th><th>場次</th><th>參加人數</th><th>平均答對率</th><th>最高顧客溫度</th><th>最近一場</th><th>參加人員</th></tr></thead><tbody>${rows}</tbody></table>
 <h2 class="ftitle" style="font-size:24px;margin-top:40px">場次明細</h2>
 <table><thead><tr><th>日期</th><th>據點</th><th>主持人</th><th>人數</th><th>答對率</th><th>溫度</th><th>參加人員（答對／作答）· 日常習慣</th></tr></thead><tbody>
 ${RES.map(r=>`<tr><td>${r.completedAt.slice(0,16).replace('T',' ')}</td><td>${esc(r.outlet)}</td><td>${esc(r.host)}</td><td>${r.playerCount}</td><td><span class="pill">${r.rate}%</span></td><td>${r.temp}°</td><td class="names">${r.players.map(p=>`<b>${esc(p.name)}</b>（${esc(p.role)}）${p.correct}/${p.answered}${p.habit?' · '+esc(p.habit):''}`).join('<br>')}</td></tr>`).join('')||'<tr><td colspan="7">尚無紀錄</td></tr>'}</tbody></table></div>`);}
window.board=board;
window.csv=()=>{const L=[['日期','區域','據點','房間','主持人','姓名','職務','作答題數','答對題數','團隊答對率','團隊顧客溫度','日常習慣']];
 RES.forEach(r=>r.players.forEach(p=>L.push([r.completedAt,r.region,r.outlet,r.room,r.host,p.name,p.role,p.answered,p.correct,r.rate,r.temp,p.habit])));
 const t='\ufeff'+L.map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='HT_NextLevel_成績_'+new Date().toISOString().slice(0,10)+'.csv';a.click();};

if(params.get('room'))player(params.get('room').toUpperCase());
else if(params.get('host')){const h=params.get('host');gate('htg_host',HOST_PWD,'DQM · 主持人入口',()=>h==='1'?hostSetup():hostRun(h.toUpperCase()));}
else if(params.get('admin'))gate('htg_admin',BOARD_PWD,'ADMIN · 成績看板',board);
else home();
</script></body></html>
